# Build the Vue app (vue-app/) and deploy it to Cloudflare (project "new-layout-vue").
#
# Now runs automatically on every push to `main` (and can still be run manually),
# so every change merged to main is published to Cloudflare and becomes visible.
#
# ONE-TIME SETUP (in your own accounts — I can't do these):
#  1. Cloudflare → My Profile → API Tokens → create a token with the
#     "Cloudflare Pages: Edit" permission.
#  2. GitHub repo → Settings → Secrets and variables → Actions → add:
#       CLOUDFLARE_API_TOKEN   = <the token>
#       CLOUDFLARE_ACCOUNT_ID  = 5de4ada115ea73e6f5199cb11941fced
# Once the secrets exist, no further manual steps are needed — push to main deploys.

name: Deploy Vue app to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "vue-app/**"
      - ".github/workflows/deploy-vue-cloudflare.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build (vue-app)
        working-directory: vue-app
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy vue-app/dist --project-name=new-layout-vue
